<!DOCTYPE html>
<html>

<head>

    <title>Update Attendance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='update_attendance.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Update Attendance</h1>

        <form method="POST">

            <input type="date"
                   name="attendance_date"
                   value="{{ attendance.attendance_date }}"
                   required>

            <input type="time"
                   name="check_in_time"
                   value="{{ attendance.check_in_time[:5] if attendance.check_in_time else '' }}"
                   required>

            <input type="time"
                   name="check_out_time"
                   value="{{ attendance.check_out_time[:5] if attendance.check_out_time else '' }}"
                   required>

            <input type="text"
                   name="status"
                   value="{{ attendance.status }}"
                   placeholder="Status"
                   required>

            <!-- FIXED BUTTON LAYOUT -->
            <div class="button-group">

                <button type="submit" class="update-btn">
                    Update Attendance
                </button>

                <a href="/details" class="back-btn">
                    Back To Details
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
