<!DOCTYPE html>
<html>

<head>

    <title>Update Employee</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='update_employee.css') }}">

</head>

<body>

<div class="container">

    <div class="card">

        <h1>Update Employee</h1>

        <form
        method="POST"
        onsubmit="return validateEmployeeForm()">

            <input
            type="text"
            id="name"
            name="name"
            value="{{ employee.name }}"
            placeholder="Employee Name"
            required>

            <input
            type="number"
            id="age"
            name="age"
            value="{{ employee.age }}"
            placeholder="Age">

            <input
            type="text"
            id="gender"
            name="gender"
            value="{{ employee.gender }}"
            placeholder="Gender">

            <input
            type="email"
            id="email"
            name="email"
            value="{{ employee.email }}"
            placeholder="Email">

            <input
            type="text"
            id="phone"
            name="phone"
            value="{{ employee.phone }}"
            placeholder="Phone">

            <input
            type="text"
            id="designation"
            name="designation"
            value="{{ employee.designation }}"
            placeholder="Designation">

            <div class="button-group">

                <button
                type="submit"
                class="update-btn">

                    Update Employee

                </button>

                <a
                href="/details"
                class="back-btn">

                    Back To Details

                </a>

            </div>

        </form>

    </div>

</div>

<script src="{{ url_for('static', filename='main.js') }}"></script>

</body>
</html>
