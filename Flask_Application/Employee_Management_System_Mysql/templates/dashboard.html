<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='dashboard.css') }}">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="overlay"></div>

<!-- SIDEBAR -->

<div class="sidebar">

    <h2>
        <i class="fa-solid fa-building"></i>
        EMS Dashboard
    </h2>

    <a href="/employees">
        <i class="fa-solid fa-users"></i>
        Employees
    </a>

    <a href="/departments">
        <i class="fa-solid fa-layer-group"></i>
        Departments
    </a>

    <a href="/salary">
        <i class="fa-solid fa-money-bill-wave"></i>
        Salary
    </a>

    <a href="/attendance">
        <i class="fa-solid fa-calendar-check"></i>
        Attendance
    </a>

    <a href="/details">
        <i class="fa-solid fa-circle-info"></i>
        Details
    </a>

    <!-- LOGOUT -->

    <a href="/logout" class="logout-btn">

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

    </a>

</div>

<!-- CONTENT -->

<div class="content">

    <h1 id="main_heading">
        Employee Management System
    </h1>

    <div id="datetime"></div>

    <div class="cards">

        <div class="card">

            <div class="icon">
                <i class="fa-solid fa-users"></i>
            </div>

            <h2>Employees</h2>

            <p>Add Employee Details</p>

        </div>

        <div class="card">

            <div class="icon">
                <i class="fa-solid fa-layer-group"></i>
            </div>

            <h2>Departments</h2>

            <p>Add Department Details</p>

        </div>

        <div class="card">

            <div class="icon">
                <i class="fa-solid fa-money-bill-wave"></i>
            </div>

            <h2>Salary</h2>

            <p>Add Salary Details</p>

        </div>

        <div class="card">

            <div class="icon">
                <i class="fa-solid fa-calendar-check"></i>
            </div>

            <h2>Attendance</h2>

            <p>Add Attendance Details</p>

        </div>

        <div class="card">

            <div class="icon">
                <i class="fa-solid fa-circle-info"></i>
            </div>

            <h2>Details</h2>

            <p>View All Details</p>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='main.js') }}"></script>

</body>
</html>
