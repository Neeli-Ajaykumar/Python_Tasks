<!DOCTYPE html>
<html>

<head>
    <title>Update Employee</title>
<link rel="stylesheet"
href="{{ url_for('static', filename='employees.css') }}">
</head>

<body>

<h1>Update Employee</h1>

<form method="POST">

    <!-- EMPLOYEE ID (READ ONLY - FIXED) -->
    <div>
        <label>Employee ID</label>
        <input
            type="text"
            value="{{ employee.id }}"
            readonly>
    </div>

    <!-- NAME -->
    <div>
        <label>Name</label>
        <input
            type="text"
            name="name"
            value="{{ employee.name }}"
            required>
    </div>

    <!-- AGE -->
    <div>
        <label>Age</label>
        <input
            type="number"
            name="age"
            value="{{ employee.age }}"
            required>
    </div>

    <!-- GENDER -->
    <div>
        <label>Gender</label>
        <input
            type="text"
            name="gender"
            value="{{ employee.gender }}">
    </div>

    <!-- EMAIL -->
    <div>
        <label>Email</label>
        <input
            type="email"
            name="email"
            value="{{ employee.email }}">
    </div>

    <!-- PHONE -->
    <div>
        <label>Phone</label>
        <input
            type="text"
            name="phone"
            value="{{ employee.phone }}">
    </div>

    <!-- DESIGNATION -->
    <div>
        <label>Designation</label>
        <input
            type="text"
            name="designation"
            value="{{ employee.designation }}">
    </div>

    <!-- ADDRESS -->
    <div>
        <label>Address</label>
        <input
            type="text"
            name="address"
            value="{{ employee.address }}">
    </div>

    <!-- JOINING DATE -->
    <div>
        <label>Joining Date</label>
        <input
            type="date"
            name="joining_date"
            value="{{ employee.joining_date }}">
    </div>

    <!-- DEPARTMENT ID -->
    <div>
        <label>Department ID</label>
        <input
            type="number"
            name="department_id"
            value="{{ employee.department_id }}"
            required>
    </div>

    <button type="submit">
        Update Employee
    </button>

</form>

</body>
</html>
